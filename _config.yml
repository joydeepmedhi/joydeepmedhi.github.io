lang: en_US

# Social profiles - edit these with your own
github_username: joydeepmedhi
linkedin_username: joydeepmedhi
twitter_username: medhijoydeep
instagram_username: meek.traveller_

logo: /apple-touch-icon.png

# jekyll-seo-tag settings
twitter:
  username: medhijoydeep
  card: summary_large_image
social:
  name: Joydeep Medhi
  links:
    - https://github.com/joydeepmedhi
    - https://www.linkedin.com/in/joydeepmedhi
    - https://x.com/medhijoydeep

# Default image for social share cards (jekyll-seo-tag reads page.image)
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-card.jpg
        width: 1200
        height: 630
        alt: "Joydeep Medhi – AI/ML Scientist, Computer Vision & Generative AI"

# Search engine ownership verification (jekyll-seo-tag). Paste the codes
# from Google Search Console / Bing Webmaster Tools and uncomment.
# webmaster_verifications:
#   google: YOUR_GOOGLE_CODE
#   bing: YOUR_BING_CODE

# Optional: a scheduling link (Calendly, Cal.com, ...) shown on /consulting/ and /contact/
booking_url: ""

# Build settings
sass:
  style: compressed
  # GitHub Pages (LibSass) needs @import; hide Dart Sass's deprecation notice
  silence_deprecations: [import]

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Theme settings
theme_mode: light # default theme when the visitor has no saved/system preference
accent_color: "#64ffda"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - package.json
  - package-lock.json
