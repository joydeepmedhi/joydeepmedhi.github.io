logo: /apple-touch-icon.png

# jekyll-seo-tag settings
twitter:
  username: medhijoydeep
  card: summary
social:
  name: Joydeep Medhi
  links:
    - https://github.com/joydeepmedhi
    - https://www.linkedin.com/in/joydeepmedhi
    - https://x.com/medhijoydeep

# Default image for social share cards (jekyll-seo-tag reads page.image)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.png

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Theme settings
theme_mode: dark # default theme when the visitor has no saved/system preference
accent_color: "#64ffda"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - package.json
  - package-lock.json
