profile: >-
  Eight years building AI systems that hold up under real conditions — tight latency budgets,
  sparse labels, unpredictable environments, and stakeholders who need answers rather than
  experiments. My work sits at the junction of computer vision, deep learning and applied GenAI,
  with the bulk of it shipped to production: a perception stack inside every MBUX Interior
  Assistant vehicle, and multi-camera tracking and VLM systems running across Lowe's store network.

