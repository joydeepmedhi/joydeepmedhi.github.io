# Papers - rendered on /publications/ and (if selected: true) on the homepage
papers:
  - title: "End-to-End Differentiable 6DoF Object Pose Estimation with Local and Global Constraints"
    authors: ["Anshul Gupta", "Joydeep Medhi", "Aratrik Chattopadhyay", "Vikram Gupta"]
    venue: "DiffCVGP Workshop, NeurIPS 2020"
    venue_short: "NeurIPS Workshop"
    year: 2020
    selected: true
    summary: >-
      Estimating an object's full 3D position and orientation (6DoF pose) from a single RGB image
      becomes hard when the object is partly hidden. We make the pipeline end-to-end differentiable
      and add two kinds of constraints: pairwise feature extraction captures local relationships
      between object points, and a triplet regularisation term enforces global consistency. Combined
      with better augmentation, this achieved state-of-the-art results on the challenging
      Occlusion LINEMOD benchmark, a 9% improvement over the previous best, and competitive results on LINEMOD.
    links:
      - { label: "arXiv", url: "https://arxiv.org/abs/2011.11078" }
      - { label: "PDF", url: "https://arxiv.org/pdf/2011.11078" }
      - { label: "Workshop paper", url: "https://montrealrobotics.ca/diffcvgp/assets/papers/6.pdf" }
      - { label: "Talk", url: "https://slideslive.com/38942640/endtoend-differentiable-6dof-object-pose-estimation-with-local-and-global-constraints" }
    bibtex: |-
      @inproceedings{gupta2020endtoend,
        title     = {End-to-End Differentiable 6DoF Object Pose Estimation with Local and Global Constraints},
        author    = {Gupta, Anshul and Medhi, Joydeep and Chattopadhyay, Aratrik and Gupta, Vikram},
        booktitle = {NeurIPS 2020 Workshop on Differentiable Vision, Graphics, and Physics Applied to Machine Learning (DiffCVGP)},
        year      = {2020},
        eprint    = {2011.11078},
        archivePrefix = {arXiv}
      }

